name: Feature request
description: Propose a scoped, verifiable improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem and user need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Physical assumptions, units and data licence
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Boundaries
      options:
        - label: This proposal does not imply live control or real-plant validation.
          required: true
