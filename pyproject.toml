[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensteamopt"
version = "0.1.0"
description = "Independent educational steam-and-power digital twin and real-time optimisation demonstrator"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{ name = "Abhijith Sivaprasadan" }]
keywords = ["steam", "energy optimisation", "modelica", "pyomo", "digital twin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "highspy==1.13.1",
  "matplotlib==3.10.8",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "plotly==6.5.0",
  "pyomo==6.9.5",
]

[project.optional-dependencies]
fmu = ["fmpy==0.3.26"]
gui = ["streamlit==1.62.0"]
dev = [
  "mypy==1.19.1",
  "pandas-stubs==2.3.3.260113",
  "pytest==9.0.2",
  "ruff==0.15.4",
]

[project.scripts]
opensteamopt = "opensteamopt.cli:main"

[project.urls]
Repository = "https://github.com/abhijith-sivaprasadan/opensteamopt"
Documentation = "https://github.com/abhijith-sivaprasadan/opensteamopt#readme"
Issues = "https://github.com/abhijith-sivaprasadan/opensteamopt/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src", "scripts", "app_streamlit.py"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
